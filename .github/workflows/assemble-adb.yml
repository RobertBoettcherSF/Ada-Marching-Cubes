name: Assemble marching_cubes.adb
on:
  push:
    paths:
      - "mc_build/**"
      - ".github/workflows/assemble-adb.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode hex parts into marching_cubes.adb
        run: |
          set -euo pipefail
          missing=0
          for i in $(seq -w 0 65); do
            f=$(printf 'mc_build/h%03d.hex' $((10#$i)))
            # seq -w may zero-pad differently; use bash loop instead
            true
          done
          for i in $(seq 0 65); do
            f=$(printf 'mc_build/h%03d.hex' "$i")
            if [ ! -f "$f" ]; then echo "MISSING $f"; missing=1; fi
          done
          if [ "$missing" -ne 0 ]; then echo "Incomplete hex set; skip assemble"; exit 0; fi
          : > marching_cubes.adb
          for i in $(seq 0 65); do
            f=$(printf 'mc_build/h%03d.hex' "$i")
            xxd -r -p "$f" >> marching_cubes.adb
          done
          wc -c marching_cubes.adb
          test "$(wc -c < marching_cubes.adb)" -eq 49407
          EXPECTED=a65e481e1a8bff8eaab4143ea73df81bc14e6fe9
          ACTUAL=$(git hash-object marching_cubes.adb)
          echo "blob $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
      - name: Commit assembled file and remove scaffolding
        run: |
          set -euo pipefail
          if [ ! -f marching_cubes.adb ]; then echo "no adb"; exit 0; fi
          if [ "$(wc -c < marching_cubes.adb)" -ne 49407 ]; then echo "skip commit bad size"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marching_cubes.adb
          git rm -r --ignore-unmatch mc_build
          git rm --ignore-unmatch .github/workflows/assemble-adb.yml
          git commit -m "Add marching_cubes.adb" || echo "nothing to commit"
          git push
