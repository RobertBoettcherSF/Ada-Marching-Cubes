name: Assemble marching_cubes.adb
on:
  push:
    paths:
      - "mc_build/**"
      - ".github/workflows/assemble-adb.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode hex parts into marching_cubes.adb
        run: |
          set -euo pipefail
          : > marching_cubes.adb
          for f in mc_build/p00.hex mc_build/p01.hex mc_build/p02.hex mc_build/p03.hex mc_build/p04.hex mc_build/p05.hex mc_build/p06.hex mc_build/p07.hex mc_build/p08.hex mc_build/p09.hex mc_build/p10.hex mc_build/p11.hex mc_build/p12.hex mc_build/p13.hex mc_build/p14.hex mc_build/p15.hex mc_build/p16.hex; do
            xxd -r -p "$f" >> marching_cubes.adb
          done
          wc -c marching_cubes.adb
          test "$(wc -c < marching_cubes.adb)" -eq 49407
          EXPECTED=a65e481e1a8bff8eaab4143ea73df81bc14e6fe9
          ACTUAL=$(git hash-object marching_cubes.adb)
          echo "blob $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
      - name: Commit assembled file and remove build scaffolding
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marching_cubes.adb
          git rm -r --ignore-unmatch mc_build
          git rm --ignore-unmatch .github/workflows/assemble-adb.yml
          git commit -m "Add marching_cubes.adb"
          git push
